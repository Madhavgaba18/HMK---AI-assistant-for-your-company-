<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HMK — Nova Finance Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-1: #0b1020;
        --bg-2: #1a1240;
        --accent: #7c3aed;
        --accent-2: #06b6d4;
      }
      html,
      body {
        height: 100%;
        font-family: "Inter", system-ui, sans-serif;
      }
      body {
        background:
          radial-gradient(1200px 800px at 10% 0%, #2b1d6e 0%, transparent 60%),
          radial-gradient(1000px 700px at 90% 100%, #0e3b58 0%, transparent 60%),
          linear-gradient(180deg, var(--bg-1) 0%, #060818 100%);
        color: #e6e8ee;
      }
      .glass {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(14px);
      }
      .bubble-user {
        background: linear-gradient(135deg, #7c3aed, #4f46e5);
      }
      .bubble-bot {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .mic-btn {
        background: linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%);
        box-shadow: 0 10px 40px -10px #7c3aed99;
      }
      .mic-btn.recording {
        background: linear-gradient(135deg, #ef4444 0%, #f59e0b 100%);
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 #ef444466; }
        50%      { box-shadow: 0 0 0 22px #ef444400; }
      }
      .typing span {
        width: 6px; height: 6px; border-radius: 9999px;
        background: #cbd5e1; display: inline-block;
        animation: bounce 1.2s infinite ease-in-out;
      }
      .typing span:nth-child(2) { animation-delay: .15s; }
      .typing span:nth-child(3) { animation-delay: .3s; }
      @keyframes bounce {
        0%,80%,100% { transform: translateY(0); opacity: .4; }
        40%         { transform: translateY(-5px); opacity: 1; }
      }
      .scroll::-webkit-scrollbar { width: 8px; }
      .scroll::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,.08); border-radius: 8px;
      }
    </style>
  </head>
  <body class="min-h-screen">
    <div class="max-w-3xl mx-auto px-4 py-6 flex flex-col h-screen">
      <header class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 rounded-2xl mic-btn flex items-center justify-center text-white font-bold"
          >
            N
          </div>
          <div>
            <div class="font-semibold tracking-tight">Nova Finance Assistant</div>
            <div class="text-xs text-slate-400">
              Offline · runs on your Mac · voice + text
            </div>
          </div>
        </div>
        <button
          id="resetBtn"
          class="text-xs text-slate-400 hover:text-white px-3 py-1 rounded-lg glass"
        >
          New chat
        </button>
      </header>

      <main
        id="chat"
        class="glass rounded-2xl flex-1 overflow-y-auto scroll p-5 space-y-4"
      ></main>

      <footer class="mt-4">
        <form id="form" class="glass rounded-2xl p-3 flex items-center gap-3">
          <input
            id="input"
            autocomplete="off"
            placeholder="Ask about policies, your team, onboarding ..."
            class="flex-1 bg-transparent outline-none px-3 py-2 placeholder-slate-500"
          />
          <button
            type="button"
            id="micBtn"
            title="Hold to talk · click to toggle"
            class="mic-btn w-12 h-12 rounded-2xl flex items-center justify-center"
          >
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>
          <button
            type="submit"
            class="px-4 py-2 rounded-xl bg-white text-slate-900 font-medium hover:bg-slate-200"
          >
            Send
          </button>
        </form>
        <div id="status" class="text-xs text-slate-500 mt-2 h-4"></div>
      </footer>
    </div>

    <audio id="player" class="hidden"></audio>
    <script src="/static/app.js"></script>
  </body>
</html>
